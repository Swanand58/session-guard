name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check the tag matches VERSION in cli.py
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)".*/\1/p' cli.py)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION \"$version\" in cli.py. Fix VERSION and CHANGELOG.md, then tag again."
            exit 1
          fi
      - name: Tests
        run: python3 test_guard.py
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac  # v0.2.0-rc1 is a pre-release
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --title "$GITHUB_REF_NAME" $flags
